<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Velto Messenger — Опрос</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  
  body {
    font-family: 'Inter', sans-serif;
    background: linear-gradient(135deg, #0F0C1B 0%, #1A1625 100%);
    color: #FFFFFF;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
    position: relative;
  }

  /* ===== ФОНОВЫЕ ПЯТНА ===== */
  .blob {
    position: absolute;
    border-radius: 50%;
    filter: blur(100px);
    z-index: 0;
    opacity: 0.6;
    animation: float 8s infinite ease-in-out alternate;
  }
  .blob-1 { width: 400px; height: 400px; background: #8B5CF6; top: -100px; left: -100px; }
  .blob-2 { width: 300px; height: 300px; background: #A855F7; bottom: -50px; right: -50px; animation-delay: 2s; }
  @keyframes float {
    0% { transform: translate(0, 0) scale(1); }
    100% { transform: translate(30px, 20px) scale(1.1); }
  }

  /* ===== КОНТЕЙНЕР КАРТОЧКИ ===== */
  .container {
    background: rgba(255, 255, 255, 0.05);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 24px;
    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
    width: 100%;
    max-width: 600px;
    padding: 40px;
    position: relative;
    z-index: 1;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    justify-content: center;
    min-height: 520px; /* Фиксированная высота для снега */
  }

  /* ===== СНЕГ ВНУТРИ КАРТОЧКИ ===== */
  .snow {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none;
    z-index: 0;
    transition: opacity 0.3s ease, transform 0.3s ease;
  }
  .snow.fade-out {
    opacity: 0;
    transform: translateY(-20px);
  }

  .snowflake {
    position: absolute;
    top: -20px;
    color: #fff;
    opacity: 0.6;
    animation: fall linear infinite, sway ease-in-out infinite alternate;
    text-shadow: 0 0 5px rgba(255,255,255,0.4);
    pointer-events: none;
    z-index: 0;
  }
  @keyframes fall {
    to { transform: translateY(600px); }
  }
  @keyframes sway {
    from { transform: translateX(-10px); }
    to { transform: translateX(10px); }
  }

  /* Остальной контент поверх снега */
  .content-wrap {
    position: relative;
    z-index: 2;
  }

  /* Экран приветствия */
  .welcome-screen { text-align: center; padding: 20px 0; animation: slideIn 0.5s ease; }
  .welcome-screen h1 {
    font-size: 38px; margin-bottom: 15px;
    background: linear-gradient(90deg, #FFFFFF, #A855F7);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  }
  .welcome-screen p { color: #A1A1AA; font-size: 16px; margin-bottom: 30px; line-height: 1.5; }

  /* Прогресс-бар */
  .progress-wrap {
    width: 100%; height: 4px; background: rgba(255, 255, 255, 0.1);
    border-radius: 2px; margin-bottom: 30px; overflow: hidden; display: none;
  }
  .progress-bar {
    height: 100%; width: 0%;
    background: linear-gradient(90deg, #8B5CF6, #A855F7);
    border-radius: 2px; transition: width 0.3s ease;
    box-shadow: 0 0 10px rgba(139, 92, 246, 0.6);
  }

  h2.title-survey { font-size: 26px; font-weight: 800; margin-bottom: 25px; text-align: center; display: none; }

  .step { display: none; animation: slideIn 0.3s ease forwards; }
  .step.active { display: block; }
  @keyframes slideIn {
    from { opacity: 0; transform: translateX(20px); }
    to { opacity: 1; transform: translateX(0); }
  }

  .question-label { display: block; font-weight: 600; color: #FFFFFF; margin-bottom: 20px; font-size: 18px; line-height: 1.4; }

  input[type="text"], input[type="email"], textarea {
    width: 100%; padding: 16px; background: rgba(255, 255, 255, 0.05);
    border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 12px;
    font-size: 16px; font-family: inherit; color: #FFFFFF;
    transition: all 0.3s ease; margin-bottom: 20px;
  }
  input:focus, textarea:focus {
    outline: none; border-color: #8B5CF6; background: rgba(255, 255, 255, 0.08);
    box-shadow: 0 0 15px rgba(139, 92, 246, 0.3);
  }
  textarea { resize: vertical; min-height: 100px; }

  .options label {
    display: flex; align-items: center; padding: 16px; margin-bottom: 12px;
    background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 12px; cursor: pointer; transition: all 0.3s ease;
    font-size: 16px; color: #FFFFFF;
  }
  .options label:hover { background: rgba(255, 255, 255, 0.08); border-color: rgba(255, 255, 255, 0.2); }
  .options input[type="radio"], .options input[type="checkbox"] {
    margin-right: 14px; accent-color: #8B5CF6; width: 18px; height: 18px; cursor: pointer;
  }
  .options label:has(input:checked) {
    border-color: #8B5CF6; background: rgba(139, 92, 246, 0.1);
    box-shadow: 0 0 15px rgba(139, 92, 246, 0.2);
  }
  .options input:checked + span { color: #A855F7; font-weight: 600; }

  .other-input { display: none; margin-top: -5px; margin-bottom: 15px; animation: slideIn 0.3s ease; }
  .other-input.active { display: block; }

  .btn {
    width: 100%; padding: 16px; background: #8B5CF6; color: #FFFFFF;
    border: none; border-radius: 12px; font-size: 17px; font-weight: 600;
    cursor: pointer; transition: all 0.2s ease; margin-top: 10px;
    box-shadow: 0 4px 15px rgba(139, 92, 246, 0.3);
  }
  .btn:hover { background: #A855F7; transform: translateY(-2px); box-shadow: 0 6px 20px rgba(168, 85, 247, 0.4); }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
  .btn-start { font-size: 18px; padding: 18px; background: linear-gradient(90deg, #8B5CF6, #A855F7); }
  .btn-row { display: flex; gap: 12px; }
  .btn-back { background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1); box-shadow: none; }
  .btn-back:hover { background: rgba(255, 255, 255, 0.1); transform: translateY(-2px); }

  .success { display: none; text-align: center; padding: 40px 0; position: relative; z-index: 2; }
  .success .icon { font-size: 60px; margin-bottom: 20px; display: inline-block; animation: pop 0.5s ease-out; }
  @keyframes pop { 0% { transform: scale(0); } 80% { transform: scale(1.2); } 100% { transform: scale(1); } }
  .success h2 { font-size: 28px; font-weight: 800; margin-bottom: 10px; }
  .success p { color: #A1A1AA; font-size: 16px; }
  .required { color: #EF4444; }

  @media (max-width: 480px) {
    .container { padding: 25px; }
    .welcome-screen h1 { font-size: 28px; }
    .question-label { font-size: 16px; }
  }
</style>
</head>
<body>

<!-- Фоновые пятна -->
<div class="blob blob-1"></div>
<div class="blob blob-2"></div>

<div class="container">
  <!-- СНЕГ -->
  <div class="snow" id="snowContainer"></div>

  <div class="content-wrap">
    <!-- ЭКРАН ПРИВЕТСТВИЯ -->
    <div id="welcomeScreen" class="welcome-screen">
      <h1>Velto Messenger</h1>
      <p>Мы создаем мессенджер нового поколения. Помогите нам сделать его идеальным — ответьте на 25 коротких вопросов.</p>
      <button type="button" class="btn btn-start" onclick="startSurvey()">Начать опрос 🚀</button>
    </div>

    <!-- ПРОГРЕСС-БАР -->
    <div class="progress-wrap" id="progressWrap">
      <div class="progress-bar" id="progressBar"></div>
    </div>

    <h2 class="title-survey" id="surveyTitle">Velto Messenger</h2>

    <!-- ФОРМА ОПРОСА -->
    <form id="surveyForm" action="https://formsubmit.co/Velto22@yandex.com" method="POST" style="display: none;">
      <input type="hidden" name="_captcha" value="false">
      <input type="hidden" name="_subject" value="Новый ответ от Velto Messenger!">
      <input type="hidden" name="_template" value="table">
      <input type="hidden" name="_next" value="https://dimkar22.github.io/VeltoSait/">

      <!-- Вопрос 1 -->
      <div class="step active" data-step="1">
        <label class="question-label" for="name">1. Ваше имя <span class="required">*</span></label>
        <input type="text" id="name" name="Имя" placeholder="Введите имя" required>
        <button type="button" class="btn" onclick="nextStep(1)">Далее</button>
      </div>

      <!-- Вопрос 2 -->
      <div class="step" data-step="2">
        <label class="question-label" for="email">2. Ваш Email <span class="required">*</span></label>
        <input type="email" id="email" name="Email" placeholder="example@mail.com" required>
        <div class="btn-row">
          <button type="button" class="btn btn-back" onclick="prevStep(2)">Назад</button>
          <button type="button" class="btn" onclick="nextStep(2)">Далее</button>
        </div>
      </div>

      <!-- Вопрос 3 -->
      <div class="step" data-step="3">
        <label class="question-label">3. Ваш возраст <span class="required">*</span></label>
        <div class="options">
          <label><input type="radio" name="Возраст" value="Младше 18" required><span>Младше 18</span></label>
          <label><input type="radio" name="Возраст" value="18-24"><span>18–24</span></label>
          <label><input type="radio" name="Возраст" value="25-34"><span>25–34</span></label>
          <label><input type="radio" name="Возраст" value="35-44"><span>35–44</span></label>
          <label><input type="radio" name="Возраст" value="45+"><span>45+</span></label>
        </div>
        <div class="btn-row">
          <button type="button" class="btn btn-back" onclick="prevStep(3)">Назад</button>
          <button type="button" class="btn" onclick="nextStep(3)">Далее</button>
        </div>
      </div>

      <!-- Вопрос 4 -->
      <div class="step" data-step="4">
        <label class="question-label">4. На какой платформе вы бы хотели видеть Velto Messenger? <span class="required">*</span></label>
        <div class="options">
          <label><input type="radio" name="Платформа" value="iOS" required><span>iOS (iPhone)</span></label>
          <label><input type="radio" name="Платформа" value="Android"><span>Android</span></label>
          <label><input type="radio" name="Платформа" value="Windows / macOS"><span>Windows / macOS</span></label>
          <label><input type="radio" name="Платформа" value="Веб-версия"><span>Веб-версия</span></label>
        </div>
        <div class="btn-row">
          <button type="button" class="btn btn-back" onclick="prevStep(4)">Назад</button>
          <button type="button" class="btn" onclick="nextStep(4)">Далее</button>
        </div>
      </div>

      <!-- Вопрос 5 -->
      <div class="step" data-step="5">
        <label class="question-label">5. Какой мессенджер вы используете чаще всего? <span class="required">*</span></label>
        <div class="options">
          <label><input type="radio" name="Текущий_мессенджер" value="Telegram" required><span>Telegram</span></label>
          <label><input type="radio" name="Текущий_мессенджер" value="WhatsApp"><span>WhatsApp</span></label>
          <label><input type="radio" name="Текущий_мессенджер" value="VK Мессенджер"><span>VK Мессенджер</span></label>
          <label><input type="radio" name="Текущий_мессенджер" value="iMessage"><span>iMessage</span></label>
          <label><input type="radio" name="Текущий_мессенджер" value="Другой"><span>Другой</span></label>
        </div>
        <div class="btn-row">
          <button type="button" class="btn btn-back" onclick="prevStep(5)">Назад</button>
          <button type="button" class="btn" onclick="nextStep(5)">Далее</button>
        </div>
      </div>

      <!-- Вопрос 6 -->
      <div class="step" data-step="6">
        <label class="question-label">6. Что для вас наиболее важно в мессенджере? (Можно несколько) <span class="required">*</span></label>
        <div class="options">
          <label><input type="checkbox" name="Важное_Безопасность" value="Да"><span>Безопасность и шифрование</span></label>
          <label><input type="checkbox" name="Важное_Скорость" value="Да"><span>Скорость работы</span></label>
          <label><input type="checkbox" name="Важное_Интерфейс" value="Да"><span>Удобный интерфейс</span></label>
          <label><input type="checkbox" name="Важное_Бесплатность" value="Да"><span>Бесплатность</span></label>
          <label>
            <input type="checkbox" id="otherCheckbox" onchange="toggleOtherInput('otherCheckbox', 'otherInputDiv')">
            <span>Другое (свой вариант)</span>
          </label>
        </div>
        <div class="other-input" id="otherInputDiv">
          <input type="text" name="Важное_Другое" placeholder="Напишите свой вариант...">
        </div>
        <div class="btn-row">
          <button type="button" class="btn btn-back" onclick="prevStep(6)">Назад</button>
          <button type="button" class="btn" onclick="nextStep(6)">Далее</button>
        </div>
      </div>

      <!-- Вопрос 7 -->
      <div class="step" data-step="7">
        <label class="question-label">7. Какую тему оформления вы предпочитаете? <span class="required">*</span></label>
        <div class="options">
          <label><input type="radio" name="Тема_оформления" value="Тёмная" required><span>Тёмная</span></label>
          <label><input type="radio" name="Тема_оформления" value="Светлая"><span>Светлая</span></label>
          <label><input type="radio" name="Тема_оформления" value="Автоматически (по системе)"><span>Автоматически (по системе)</span></label>
        </div>
        <div class="btn-row">
          <button type="button" class="btn btn-back" onclick="prevStep(7)">Назад</button>
          <button type="button" class="btn" onclick="nextStep(7)">Далее</button>
        </div>
      </div>

      <!-- Вопрос 8 -->
      <div class="step" data-step="8">
        <label class="question-label">8. Нужны ли вам видеозвонки в мессенджере? <span class="required">*</span></label>
        <div class="options">
          <label><input type="radio" name="Видеозвонки" value="Да, обязательно" required><span>Да, обязательно</span></label>
          <label><input type="radio" name="Видеозвонки" value="Иногда пользуюсь"><span>Иногда пользуюсь</span></label>
          <label><input type="radio" name="Видеозвонки" value="Нет, не нужны"><span>Нет, не нужны</span></label>
        </div>
        <div class="btn-row">
          <button type="button" class="btn btn-back" onclick="prevStep(8)">Назад</button>
          <button type="button" class="btn" onclick="nextStep(8)">Далее</button>
        </div>
      </div>

      <!-- Вопрос 9 -->
      <div class="step" data-step="9">
        <label class="question-label">9. Важна ли вам возможность отправлять голосовые сообщения? <span class="required">*</span></label>
        <div class="options">
          <label><input type="radio" name="Голосовые" value="Очень важна" required><span>Очень важна</span></label>
          <label><input type="radio" name="Голосовые" value="Иногда использую"><span>Иногда использую</span></label>
          <label><input type="radio" name="Голосовые" value="Не важна"><span>Не важна</span></label>
        </div>
        <div class="btn-row">
          <button type="button" class="btn btn-back" onclick="prevStep(9)">Назад</button>
          <button type="button" class="btn" onclick="nextStep(9)">Далее</button>
        </div>
      </div>

      <!-- Вопрос 10 -->
      <div class="step" data-step="10">
        <label class="question-label">10. Готовы ли вы платить за премиум-функции? <span class="required">*</span></label>
        <div class="options">
          <label><input type="radio" name="Премиум" value="Да, если функции стоящие" required><span>Да, если функции стоящие</span></label>
          <label><input type="radio" name="Премиум" value="Скорее нет"><span>Скорее нет</span></label>
          <label><input type="radio" name="Премиум" value="Только бесплатную версию"><span>Только бесплатную версию</span></label>
        </div>
        <div class="btn-row">
          <button type="button" class="btn btn-back" onclick="prevStep(10)">Назад</button>
          <button type="button" class="btn" onclick="nextStep(10)">Далее</button>
        </div>
      </div>

      <!-- Вопрос 11 -->
      <div class="step" data-step="11">
        <label class="question-label">11. Готовы ли вы тестировать Velto Messenger до официального релиза? <span class="required">*</span></label>
        <div class="options">
          <label><input type="radio" name="Готовность_тестировать" value="Да, с удовольствием" required><span>Да, с удовольствием</span></label>
          <label><input type="radio" name="Готовность_тестировать" value="Возможно"><span>Возможно</span></label>
          <label><input type="radio" name="Готовность_тестировать" value="Нет"><span>Нет</span></label>
        </div>
        <div class="btn-row">
          <button type="button" class="btn btn-back" onclick="prevStep(11)">Назад</button>
          <button type="button" class="btn" onclick="nextStep(11)">Далее</button>
        </div>
      </div>

      <!-- Вопрос 12 -->
      <div class="step" data-step="12">
        <label class="question-label">12. Откуда вы узнали о Velto Messenger? <span class="required">*</span></label>
        <div class="options">
          <label><input type="radio" name="Источник" value="Социальные сети" required><span>Социальные сети</span></label>
          <label><input type="radio" name="Источник" value="Друзья / знакомые"><span>Друзья / знакомые</span></label>
          <label><input type="radio" name="Источник" value="Реклама"><span>Реклама</span></label>
          <label><input type="radio" name="Источник" value="Случайно нашел"><span>Случайно нашел</span></label>
        </div>
        <div class="btn-row">
          <button type="button" class="btn btn-back" onclick="prevStep(12)">Назад</button>
          <button type="button" class="btn" onclick="nextStep(12)">Далее</button>
        </div>
      </div>

      <!-- Вопрос 13 -->
      <div class="step" data-step="13">
        <label class="question-label" for="features">13. Какие функции вы хотите видеть в Velto Messenger?</label>
        <textarea id="features" name="Желаемые_функции" placeholder="Опишите, что для вас важно..."></textarea>
        <div class="btn-row">
          <button type="button" class="btn btn-back" onclick="prevStep(13)">Назад</button>
          <button type="button" class="btn" onclick="nextStep(13)">Далее</button>
        </div>
      </div>

      <!-- Вопрос 14 -->
      <div class="step" data-step="14">
        <label class="question-label">14. Порекомендуете ли вы Velto Messenger друзьям? <span class="required">*</span></label>
        <div class="options">
          <label><input type="radio" name="Рекомендация" value="Определенно да" required><span>Определенно да</span></label>
          <label><input type="radio" name="Рекомендация" value="Скорее да"><span>Скорее да</span></label>
          <label><input type="radio" name="Рекомендация" value="Скорее нет"><span>Скорее нет</span></label>
          <label><input type="radio" name="Рекомендация" value="Определенно нет"><span>Определенно нет</span></label>
        </div>
        <div class="btn-row">
          <button type="button" class="btn btn-back" onclick="prevStep(14)">Назад</button>
          <button type="button" class="btn" onclick="nextStep(14)">Далее</button>
        </div>
      </div>

      <!-- Вопрос 15 -->
      <div class="step" data-step="15">
        <label class="question-label">15. Как часто вы отправляете медиафайлы в мессенджерах? <span class="required">*</span></label>
        <div class="options">
          <label><input type="radio" name="Частота_медиа" value="Каждый день" required><span>Каждый день</span></label>
          <label><input type="radio" name="Частота_медиа" value="Несколько раз в неделю"><span>Несколько раз в неделю</span></label>
          <label><input type="radio" name="Частота_медиа" value="Редко"><span>Редко</span></label>
          <label><input type="radio" name="Частота_медиа" value="Почти никогда"><span>Почти никогда</span></label>
        </div>
        <div class="btn-row">
          <button type="button" class="btn btn-back" onclick="prevStep(15)">Назад</button>
          <button type="button" class="btn" onclick="nextStep(15)">Далее</button>
        </div>
      </div>

      <!-- Вопрос 16 -->
      <div class="step" data-step="16">
        <label class="question-label">16. Насколько важна возможность создавать групповые чаты? <span class="required">*</span></label>
        <div class="options">
          <label><input type="radio" name="Групповые_чаты" value="Критически важна" required><span>Критически важна</span></label>
          <label><input type="radio" name="Групповые_чаты" value="Полезна, но не обязательна"><span>Полезна, но не обязательна</span></label>
          <label><input type="radio" name="Групповые_чаты" value="Не важна"><span>Не важна</span></label>
        </div>
        <div class="btn-row">
          <button type="button" class="btn btn-back" onclick="prevStep(16)">Назад</button>
          <button type="button" class="btn" onclick="nextStep(16)">Далее</button>
        </div>
      </div>

      <!-- Вопрос 17 (ИЗМЕНЕН) -->
      <div class="step" data-step="17">
        <label class="question-label">17. Какой способ оплаты премиум-подписки вам удобнее? <span class="required">*</span></label>
        <div class="options">
          <label><input type="radio" name="Оплата" value="Ежемесячная подписка" required onchange="toggleOtherInput('otherPayCheckbox', 'otherPayDiv', true)"><span>Ежемесячная подписка</span></label>
          <label><input type="radio" name="Оплата" value="Годовая подписка (со скидкой)" onchange="toggleOtherInput('otherPayCheckbox', 'otherPayDiv', true)"><span>Годовая подписка (со скидкой)</span></label>
          <label><input type="radio" name="Оплата" value="Разовый платёж навсегда" onchange="toggleOtherInput('otherPayCheckbox', 'otherPayDiv', true)"><span>Разовый платёж навсегда</span></label>
          <label>
            <input type="radio" id="otherPayCheckbox" name="Оплата" value="Не хочу" onchange="toggleOtherInput('otherPayCheckbox', 'otherPayDiv', true)">
            <span>Не хочу</span>
          </label>
        </div>
        <div class="other-input" id="otherPayDiv">
          <input type="text" name="Оплата_Почему" id="payWhyInput" placeholder="Почему? (обязательно)" required>
        </div>
        <div class="btn-row">
          <button type="button" class="btn btn-back" onclick="prevStep(17)">Назад</button>
          <button type="button" class="btn" onclick="nextStep(17)">Далее</button>
        </div>
      </div>

      <!-- Вопрос 18 -->
      <div class="step" data-step="18">
        <label class="question-label">18. Какие интеграции вам интересны? (Можно несколько) <span class="required">*</span></label>
        <div class="options">
          <label><input type="checkbox" name="Интеграция_Календарь" value="Да"><span>Календарь и напоминания</span></label>
          <label><input type="checkbox" name="Интеграция_Облако" value="Да"><span>Облачные хранилища</span></label>
          <label><input type="checkbox" name="Интеграция_Задачи" value="Да"><span>Таск-менеджеры</span></label>
          <label><input type="checkbox" name="Интеграция_ИИ" value="Да"><span>ИИ-ассистенты</span></label>
          <label>
            <input type="checkbox" id="otherIntegrationCheckbox" onchange="toggleOtherInput('otherIntegrationCheckbox', 'otherIntegrationDiv')">
            <span>Другое</span>
          </label>
        </div>
        <div class="other-input" id="otherIntegrationDiv">
          <input type="text" name="Интеграция_Другое" placeholder="Напишите свои варианты...">
        </div>
        <div class="btn-row">
          <button type="button" class="btn btn-back" onclick="prevStep(18)">Назад</button>
          <button type="button" class="btn" onclick="nextStep(18)">Далее</button>
        </div>
      </div>

      <!-- Вопрос 19 -->
      <div class="step" data-step="19">
        <label class="question-label">19. Насколько важно наличие сквозного шифрования? <span class="required">*</span></label>
        <div class="options">
          <label><input type="radio" name="Шифрование" value="Обязательно" required><span>Обязательно</span></label>
          <label><input type="radio" name="Шифрование" value="Желательно"><span>Желательно</span></label>
          <label><input type="radio" name="Шифрование" value="Не имеет значения"><span>Не имеет значения</span></label>
        </div>
        <div class="btn-row">
          <button type="button" class="btn btn-back" onclick="prevStep(19)">Назад</button>
          <button type="button" class="btn" onclick="nextStep(19)">Далее</button>
        </div>
      </div>

      <!-- Вопрос 20 -->
      <div class="step" data-step="20">
        <label class="question-label">20. Пользуетесь ли вы стикерами и GIF в мессенджерах? <span class="required">*</span></label>
        <div class="options">
          <label><input type="radio" name="Стикеры" value="Да, постоянно" required><span>Да, постоянно</span></label>
          <label><input type="radio" name="Стикеры" value="Иногда"><span>Иногда</span></label>
          <label><input type="radio" name="Стикеры" value="Нет, не использую"><span>Нет, не использую</span></label>
        </div>
        <div class="btn-row">
          <button type="button" class="btn btn-back" onclick="prevStep(20)">Назад</button>
          <button type="button" class="btn" onclick="nextStep(20)">Далее</button>
        </div>
      </div>

      <!-- Вопрос 21 -->
      <div class="step" data-step="21">
        <label class="question-label">21. Какой дизайн иконки приложения вам нравится? <span class="required">*</span></label>
        <div class="options">
          <label><input type="radio" name="Иконка" value="Минимализм (одна фигура)" required><span>Минимализм (одна фигура)</span></label>
          <label><input type="radio" name="Иконка" value="3D-градиент"><span>3D-градиент</span></label>
          <label><input type="radio" name="Иконка" value="Абстрактная геометрия"><span>Абстрактная геометрия</span></label>
        </div>
        <div class="btn-row">
          <button type="button" class="btn btn-back" onclick="prevStep(21)">Назад</button>
          <button type="button" class="btn" onclick="nextStep(21)">Далее</button>
        </div>
      </div>

      <!-- Вопрос 22 -->
      <div class="step" data-step="22">
        <label class="question-label">22. Планируете ли вы использовать Velto Messenger для работы? <span class="required">*</span></label>
        <div class="options">
          <label><input type="radio" name="Для_работы" value="Да, как основной инструмент" required><span>Да, как основной инструмент</span></label>
          <label><input type="radio" name="Для_работы" value="Иногда, для общения с коллегами"><span>Иногда, для общения с коллегами</span></label>
          <label><input type="radio" name="Для_работы" value="Нет, только для личного общения"><span>Нет, только для личного общения</span></label>
        </div>
        <div class="btn-row">
          <button type="button" class="btn btn-back" onclick="prevStep(22)">Назад</button>
          <button type="button" class="btn" onclick="nextStep(22)">Далее</button>
        </div>
      </div>

      <!-- Вопрос 23 (ИЗМЕНЕН) -->
      <div class="step" data-step="23">
        <label class="question-label">23. Что бы вас заставило удалить мессенджер? (Можно несколько) <span class="required">*</span></label>
        <div class="options">
          <label><input type="checkbox" name="Удаление_Реклама" value="Да"><span>Навязчивая реклама</span></label>
          <label><input type="checkbox" name="Удаление_Безопасность" value="Да"><span>Плохая безопасность (утечки данных)</span></label>
          <label><input type="checkbox" name="Удаление_Зависания" value="Да"><span>Сильные зависания и баги</span></label>
          <label><input type="checkbox" name="Удаление_Функции" value="Да"><span>Отсутствие нужных функций</span></label>
          <label>
            <input type="checkbox" id="otherDeleteCheckbox" onchange="toggleOtherInput('otherDeleteCheckbox', 'otherDeleteDiv')">
            <span>Другое</span>
          </label>
        </div>
        <div class="other-input" id="otherDeleteDiv">
          <input type="text" name="Удаление_Другое" placeholder="Напишите свою причину...">
        </div>
        <div class="btn-row">
          <button type="button" class="btn btn-back" onclick="prevStep(23)">Назад</button>
          <button type="button" class="btn" onclick="nextStep(23)">Далее</button>
        </div>
      </div>

      <!-- Вопрос 24 -->
      <div class="step" data-step="24">
        <label class="question-label">24. Как вы относитесь к тематическим темам оформления (Хэллоуин, Новый год)? <span class="required">*</span></label>
        <div class="options">
          <label><input type="radio" name="Темы" value="Мне нравится, буду использовать" required><span>Мне нравится, буду использовать</span></label>
          <label><input type="radio" name="Темы" value="Нейтрально"><span>Нейтрально</span></label>
          <label><input type="radio" name="Темы" value="Не люблю, отвлекает"><span>Не люблю, отвлекает</span></label>
        </div>
        <div class="btn-row">
          <button type="button" class="btn btn-back" onclick="prevStep(24)">Назад</button>
          <button type="button" class="btn" onclick="nextStep(24)">Далее</button>
        </div>
      </div>

      <!-- Вопрос 25 -->
      <div class="step" data-step="25">
        <label class="question-label" for="wishes">25. Ваши дополнительные пожелания</label>
        <textarea id="wishes" name="Пожелания" placeholder="Всё, что хотите добавить..."></textarea>
        <div class="btn-row">
          <button type="button" class="btn btn-back" onclick="prevStep(25)">Назад</button>
          <button type="submit" class="btn" id="submitBtn">Отправить ответы</button>
        </div>
      </div>

    </form>

    <!-- ЭКРАН УСПЕХА -->
    <div class="success" id="successMessage">
      <div class="icon">✅</div>
      <h2>Спасибо!</h2>
      <p>Ваши ответы отправлены. Мы ценим ваш вклад в развитие Velto Messenger.</p>
    </div>
  </div>
</div>

<script>
  // ===== ГЕНЕРАЦИЯ СНЕГА =====
  const snowContainer = document.getElementById('snowContainer');
  const snowflakeCount = 30; 
  const snowflakeChars = ['❅', '❆', '❄', '✧', '•'];
  
  function createSnow() {
    snowContainer.innerHTML = ''; 
    snowContainer.classList.remove('fade-out');
    
    for (let i = 0; i < snowflakeCount; i++) {
      const snowflake = document.createElement('div');
      snowflake.className = 'snowflake';
      snowflake.innerHTML = snowflakeChars[Math.floor(Math.random() * snowflakeChars.length)];
      snowflake.style.left = Math.random() * 100 + '%';
      snowflake.style.fontSize = (Math.random() * 6 + 6) + 'px';
      snowflake.style.opacity = Math.random() * 0.5 + 0.3;
      snowflake.style.animationDuration = (Math.random() * 6 + 4) + 's, ' + (Math.random() * 2 + 1) + 's';
      snowflake.style.animationDelay = Math.random() * 3 + 's, ' + Math.random() * 2 + 's';
      snowContainer.appendChild(snowflake);
    }
  }

  createSnow();

  // ===== ЛОГИКА ОПРОСА =====
  const totalSteps = 25;
  let currentStep = 1;
  const progressBar = document.getElementById('progressBar');

  function startSurvey() {
    document.getElementById('welcomeScreen').style.display = 'none';
    document.getElementById('progressWrap').style.display = 'block';
    document.getElementById('surveyTitle').style.display = 'block';
    document.getElementById('surveyForm').style.display = 'block';
    updateProgress();
  }

  function updateProgress() {
    const percent = ((currentStep - 1) / (totalSteps - 1)) * 100;
    progressBar.style.width = percent + '%';
  }

  // Универсальная функция для показа поля "Другое"
  function toggleOtherInput(checkboxId, divId, isRadio = false) {
    const checkbox = document.getElementById(checkboxId);
    const inputDiv = document.getElementById(divId);
    
    if (isRadio) {
      // Для радио-кнопок проверяем, выбран ли именно этот вариант
      if (checkbox.checked) {
        inputDiv.classList.add('active');
        // Делаем поле обязательным, если выбран "Не хочу"
        const input = inputDiv.querySelector('input');
        if (input) input.required = true;
      } else {
        inputDiv.classList.remove('active');
        const input = inputDiv.querySelector('input');
        if (input) {
          input.required = false;
          input.value = ''; // Очищаем, если передумали
        }
      }
    } else {
      // Для чекбоксов просто переключаем
      if (checkbox.checked) {
        inputDiv.classList.add('active');
      } else {
        inputDiv.classList.remove('active');
      }
    }
  }

  // Функция для анимации перехода снега
  function animateSnowTransition(callback) {
    snowContainer.classList.add('fade-out');
    setTimeout(() => {
      callback();
      createSnow();
    }, 300);
  }

  function nextStep(step) {
    const currentDiv = document.querySelector(`.step[data-step="${step}"]`);
    let valid = true;

    // 1. Проверка текстовых полей
    const requiredTexts = currentDiv.querySelectorAll('input[type="text"][required], input[type="email"][required]');
    requiredTexts.forEach(field => {
      if (!field.value.trim()) { field.reportValidity(); valid = false; }
    });

    // 2. Проверка радио-кнопок
    const radioGroups = {};
    currentDiv.querySelectorAll('input[type="radio"][required]').forEach(radio => {
      radioGroups[radio.name] = true;
    });
    for (const name in radioGroups) {
      if (!currentDiv.querySelector(`input[name="${name}"]:checked`)) {
        valid = false;
        alert('Пожалуйста, выберите вариант ответа.');
        return;
      }
    }

    // 3. Специфичная проверка для вопроса 17 (Оплата)
    if (step === 17) {
      const payWhyInput = document.getElementById('payWhyInput');
      if (payWhyInput.required && !payWhyInput.value.trim()) {
        alert('Пожалуйста, напишите, почему вы не хотите платить.');
        valid = false;
        return;
      }
    }

    // 4. Проверка чекбоксов (вопросы 6, 18, 23)
    if (step === 6 || step === 18 || step === 23) {
      const checkedBoxes = currentDiv.querySelectorAll('input[type="checkbox"]:checked');
      if (checkedBoxes.length === 0) {
        valid = false; alert('Пожалуйста, выберите хотя бы один вариант.'); return;
      }
      // Проверка полей "Другое" в чекбоксах
      if (step === 6) {
        const cb = document.getElementById('otherCheckbox');
        if (cb && cb.checked) {
          const txt = document.getElementById('otherInputDiv').querySelector('input').value.trim();
          if (!txt) { alert('Пожалуйста, напишите свой вариант в поле "Другое".'); return; }
        }
      } else if (step === 18) {
        const cb = document.getElementById('otherIntegrationCheckbox');
        if (cb && cb.checked) {
          const txt = document.getElementById('otherIntegrationDiv').querySelector('input').value.trim();
          if (!txt) { alert('Пожалуйста, напишите свой вариант в поле "Другое".'); return; }
        }
      } else if (step === 23) {
        const cb = document.getElementById('otherDeleteCheckbox');
        if (cb && cb.checked) {
          const txt = document.getElementById('otherDeleteDiv').querySelector('input').value.trim();
          if (!txt) { alert('Пожалуйста, напишите свою причину в поле "Другое".'); return; }
        }
      }
    }

    if (!valid) return;

    // Анимация перехода
    if (step < totalSteps) {
      animateSnowTransition(() => {
        currentDiv.classList.remove('active');
        document.querySelector(`.step[data-step="${step + 1}"]`).classList.add('active');
        currentStep = step + 1;
        updateProgress();
      });
    }
  }

  function prevStep(step) {
    if (step > 1) {
      animateSnowTransition(() => {
        document.querySelector(`.step[data-step="${step}"]`).classList.remove('active');
        document.querySelector(`.step[data-step="${step - 1}"]`).classList.add('active');
        currentStep = step - 1;
        updateProgress();
      });
    }
  }

  // ===== МГНОВЕННАЯ ОТПРАВКА =====
  const form = document.getElementById('surveyForm');
  const success = document.getElementById('successMessage');
  const submitBtn = document.getElementById('submitBtn');

  form.addEventListener('submit', function(e) {
    e.preventDefault(); 
    submitBtn.textContent = 'Отправка...';
    submitBtn.disabled = true;

    // Собираем данные формы для отправки
    const formData = new FormData(form);
    
    // Отправляем через fetch. Это самый надежный способ.
    // Используем текстовый ответ, так как formsubmit.co возвращает HTML.
    fetch(form.action, {
      method: 'POST',
      body: formData,
      headers: {
        'Accept': 'application/json'
      }
    })
    .then(response => {
      // Если запрос прошел успешно (сервер ответил 200)
      form.style.display = 'none';
      document.getElementById('progressWrap').style.display = 'none';
      document.getElementById('surveyTitle').style.display = 'none';
      success.style.display = 'block';
      createSnow(); // Обновляем снег
    })
    .catch(error => {
      // Если ошибка сети
      console.error('Ошибка:', error);
      alert('Произошла ошибка при отправке. Пожалуйста, попробуйте еще раз.');
      submitBtn.textContent = 'Отправить ответы';
      submitBtn.disabled = false;
    });
  });
</script>

</body>
</html>
