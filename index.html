<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Velto Messenger — Опрос</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Inter', sans-serif;
    background: linear-gradient(135deg, #0F0C1B 0%, #1A1625 100%);
    color: #FFFFFF;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
    overflow-x: hidden;
    position: relative;
  }

  /* Фоновые свечения */
  .blob {
    position: absolute;
    border-radius: 50%;
    filter: blur(100px);
    z-index: 0;
    opacity: 0.6;
    animation: float 8s infinite ease-in-out alternate;
  }
  .blob-1 { width: 400px; height: 400px; background: #8B5CF6; top: -100px; left: -100px; }
  .blob-2 { width: 300px; height: 300px; background: #A855F7; bottom: -50px; right: -50px; animation-delay: 2s; }
  @keyframes float {
    0% { transform: translate(0, 0) scale(1); }
    100% { transform: translate(30px, 20px) scale(1.1); }
  }

  /* Контейнер */
  .container {
    background: rgba(255, 255, 255, 0.05);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 24px;
    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
    width: 100%;
    max-width: 600px;
    padding: 40px;
    position: relative;
    z-index: 1;
    overflow: hidden;
  }

  /* Прогресс-бар */
  .progress-wrap {
    width: 100%;
    height: 4px;
    background: rgba(255, 255, 255, 0.1);
    border-radius: 2px;
    margin-bottom: 30px;
    overflow: hidden;
  }
  .progress-bar {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, #8B5CF6, #A855F7);
    border-radius: 2px;
    transition: width 0.4s ease;
    box-shadow: 0 0 10px rgba(139, 92, 246, 0.6);
  }

  /* Типографика */
  h1 {
    font-size: 32px;
    font-weight: 800;
    margin-bottom: 30px;
    text-align: center;
    letter-spacing: -0.5px;
  }

  /* Экраны вопросов */
  .step {
    display: none;
    animation: slideIn 0.4s ease forwards;
  }
  .step.active {
    display: block;
  }
  @keyframes slideIn {
    from { opacity: 0; transform: translateX(30px); }
    to { opacity: 1; transform: translateX(0); }
  }

  .question-label {
    display: block;
    font-weight: 600;
    color: #FFFFFF;
    margin-bottom: 20px;
    font-size: 18px;
    line-height: 1.4;
  }

  /* Инпуты */
  input[type="text"],
  input[type="email"],
  textarea {
    width: 100%;
    padding: 16px;
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 12px;
    font-size: 16px;
    font-family: inherit;
    color: #FFFFFF;
    transition: all 0.3s ease;
    margin-bottom: 20px;
  }
  input:focus, textarea:focus {
    outline: none;
    border-color: #8B5CF6;
    background: rgba(255, 255, 255, 0.08);
    box-shadow: 0 0 15px rgba(139, 92, 246, 0.3);
  }
  textarea {
    resize: vertical;
    min-height: 120px;
  }

  /* Варианты ответов */
  .options label {
    display: flex;
    align-items: center;
    padding: 16px;
    margin-bottom: 12px;
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 12px;
    cursor: pointer;
    transition: all 0.3s ease;
    font-size: 16px;
    color: #FFFFFF;
  }
  .options label:hover {
    background: rgba(255, 255, 255, 0.08);
    border-color: rgba(255, 255, 255, 0.2);
  }
  .options input[type="radio"],
  .options input[type="checkbox"] {
    margin-right: 14px;
    accent-color: #8B5CF6;
    width: 18px;
    height: 18px;
    cursor: pointer;
  }
  .options label:has(input:checked) {
    border-color: #8B5CF6;
    background: rgba(139, 92, 246, 0.1);
    box-shadow: 0 0 15px rgba(139, 92, 246, 0.2);
  }
  .options input:checked + span {
    color: #A855F7;
    font-weight: 600;
  }

  /* Кнопки */
  .btn {
    width: 100%;
    padding: 16px;
    background: #8B5CF6;
    color: #FFFFFF;
    border: none;
    border-radius: 12px;
    font-size: 17px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.3s ease;
    margin-top: 10px;
    box-shadow: 0 4px 15px rgba(139, 92, 246, 0.3);
  }
  .btn:hover {
    background: #A855F7;
    transform: translateY(-2px);
    box-shadow: 0 6px 20px rgba(168, 85, 247, 0.4);
  }
  .btn:disabled {
    opacity: 0.5;
    cursor: not-allowed;
    transform: none;
  }
  .btn-row {
    display: flex;
    gap: 12px;
  }
  .btn-back {
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid rgba(255, 255, 255, 0.1);
    box-shadow: none;
  }
  .btn-back:hover {
    background: rgba(255, 255, 255, 0.1);
    transform: translateY(-2px);
  }

  /* Экран успеха */
  .success {
    display: none;
    text-align: center;
    padding: 40px 0;
  }
  .success .icon {
    font-size: 60px;
    margin-bottom: 20px;
    display: inline-block;
    animation: pop 0.5s ease-out;
  }
  @keyframes pop {
    0% { transform: scale(0); }
    80% { transform: scale(1.2); }
    100% { transform: scale(1); }
  }
  .success h2 { font-size: 28px; font-weight: 800; margin-bottom: 10px; }
  .success p { color: #A1A1AA; font-size: 16px; }
  .required { color: #EF4444; }

  @media (max-width: 480px) {
    .container { padding: 25px; }
    h1 { font-size: 26px; }
    .question-label { font-size: 16px; }
  }
</style>
</head>
<body>

<div class="blob blob-1"></div>
<div class="blob blob-2"></div>

<div class="container">
  <!-- Прогресс-бар -->
  <div class="progress-wrap">
    <div class="progress-bar" id="progressBar"></div>
  </div>

  <form id="surveyForm" action="https://formsubmit.co/Velto22@yandex.com" method="POST">
    <!-- Настройки FormSubmit -->
    <input type="hidden" name="_captcha" value="false">
    <input type="hidden" name="_subject" value="Новый ответ от Velto Messenger!">
    <input type="hidden" name="_template" value="table">

    <h1>Velto Messenger</h1>

    <!-- ===== ВОПРОС 1: Имя ===== -->
    <div class="step active" data-step="1">
      <label class="question-label" for="name">Ваше имя <span class="required">*</span></label>
      <input type="text" id="name" name="Имя" placeholder="Введите имя" required>
      <button type="button" class="btn" onclick="nextStep(1)">Далее</button>
    </div>

    <!-- ===== ВОПРОС 2: Email ===== -->
    <div class="step" data-step="2">
      <label class="question-label" for="email">Ваш Email <span class="required">*</span></label>
      <input type="email" id="email" name="Email" placeholder="example@mail.com" required>
      <div class="btn-row">
        <button type="button" class="btn btn-back" onclick="prevStep(2)">Назад</button>
        <button type="button" class="btn" onclick="nextStep(2)">Далее</button>
      </div>
    </div>

    <!-- ===== ВОПРОС 3: Частота использования ===== -->
    <div class="step" data-step="3">
      <label class="question-label">Как часто вы пользуетесь Velto Messenger? <span class="required">*</span></label>
      <div class="options">
        <label><input type="radio" name="Частота использования" value="Каждый день" required><span>Каждый день</span></label>
        <label><input type="radio" name="Частота использования" value="Несколько раз в неделю"><span>Несколько раз в неделю</span></label>
        <label><input type="radio" name="Частота использования" value="Редко"><span>Редко</span></label>
        <label><input type="radio" name="Частота использования" value="Только начинаю пользоваться"><span>Только начинаю пользоваться</span></label>
      </div>
      <div class="btn-row">
        <button type="button" class="btn btn-back" onclick="prevStep(3)">Назад</button>
        <button type="button" class="btn" onclick="nextStep(3)">Далее</button>
      </div>
    </div>

    <!-- ===== ВОПРОС 4: Какие функции нужны (Текст) ===== -->
    <div class="step" data-step="4">
      <label class="question-label" for="features">Какие функции вам нужны в Velto Messenger?</label>
      <textarea id="features" name="Нужные функции" placeholder="Опишите, чего вам не хватает..."></textarea>
      <div class="btn-row">
        <button type="button" class="btn btn-back" onclick="prevStep(4)">Назад</button>
        <button type="button" class="btn" onclick="nextStep(4)">Далее</button>
      </div>
    </div>

    <!-- ===== ВОПРОС 5: Оценка интерфейса ===== -->
    <div class="step" data-step="5">
      <label class="question-label">Оцените удобство интерфейса Velto Messenger <span class="required">*</span></label>
      <div class="options">
        <label><input type="radio" name="Оценка интерфейса" value="5 — Отлично" required><span>5 — Отлично</span></label>
        <label><input type="radio" name="Оценка интерфейса" value="4 — Хорошо"><span>4 — Хорошо</span></label>
        <label><input type="radio" name="Оценка интерфейса" value="3 — Нормально"><span>3 — Нормально</span></label>
        <label><input type="radio" name="Оценка интерфейса" value="2 — Плохо"><span>2 — Плохо</span></label>
        <label><input type="radio" name="Оценка интерфейса" value="1 — Ужасно"><span>1 — Ужасно</span></label>
      </div>
      <div class="btn-row">
        <button type="button" class="btn btn-back" onclick="prevStep(5)">Назад</button>
        <button type="button" class="btn" onclick="nextStep(5)">Далее</button>
      </div>
    </div>

    <!-- ===== ВОПРОС 6: Что улучшить (Текст) ===== -->
    <div class="step" data-step="6">
      <label class="question-label" for="improvements">Что бы вы улучшили в Velto Messenger?</label>
      <textarea id="improvements" name="Что улучшить" placeholder="Ваши идеи и предложения..."></textarea>
      <div class="btn-row">
        <button type="button" class="btn btn-back" onclick="prevStep(6)">Назад</button>
        <button type="button" class="btn" onclick="nextStep(6)">Далее</button>
      </div>
    </div>

    <!-- ===== ВОПРОС 7: Рекомендация ===== -->
    <div class="step" data-step="7">
      <label class="question-label">Порекомендуете ли вы Velto Messenger друзьям? <span class="required">*</span></label>
      <div class="options">
        <label><input type="radio" name="Рекомендация" value="Да, обязательно" required><span>Да, обязательно</span></label>
        <label><input type="radio" name="Рекомендация" value="Скорее да"><span>Скорее да</span></label>
        <label><input type="radio" name="Рекомендация" value="Скорее нет"><span>Скорее нет</span></label>
        <label><input type="radio" name="Рекомендация" value="Нет"><span>Нет</span></label>
      </div>
      <div class="btn-row">
        <button type="button" class="btn btn-back" onclick="prevStep(7)">Назад</button>
        <button type="submit" class="btn" id="submitBtn">Отправить ответы</button>
      </div>
    </div>

  </form>

  <!-- Экран успеха -->
  <div class="success" id="successMessage">
    <div class="icon">✅</div>
    <h2>Спасибо!</h2>
    <p>Ваши ответы отправлены. Мы ценим ваш вклад в развитие Velto Messenger.</p>
  </div>
</div>

<script>
  const totalSteps = 7;
  let currentStep = 1;
  const progressBar = document.getElementById('progressBar');

  // Обновление прогресс-бара
  function updateProgress() {
    const percent = ((currentStep - 1) / (totalSteps - 1)) * 100;
    progressBar.style.width = percent + '%';
  }

  // Переход вперед
  function nextStep(step) {
    // Проверка обязательных полей на текущем шаге
    const currentDiv = document.querySelector(`.step[data-step="${step}"]`);
    const requiredFields = currentDiv.querySelectorAll('[required]');
    let valid = true;
    requiredFields.forEach(field => {
      if (!field.value && field.type !== 'radio' && field.type !== 'checkbox') {
        field.reportValidity();
        valid = false;
      }
    });
    // Проверка радио-кнопок
    const radioGroups = {};
    currentDiv.querySelectorAll('input[type="radio"][required]').forEach(radio => {
      radioGroups[radio.name] = true;
    });
    for (const name in radioGroups) {
      if (!currentDiv.querySelector(`input[name="${name}"]:checked`)) {
        valid = false;
        alert('Пожалуйста, выберите вариант ответа.');
        return;
      }
    }
    if (!valid) return;

    if (step < totalSteps) {
      currentDiv.classList.remove('active');
      const nextDiv = document.querySelector(`.step[data-step="${step + 1}"]`);
      nextDiv.classList.add('active');
      currentStep = step + 1;
      updateProgress();
    }
  }

  // Переход назад
  function prevStep(step) {
    if (step > 1) {
      document.querySelector(`.step[data-step="${step}"]`).classList.remove('active');
      document.querySelector(`.step[data-step="${step - 1}"]`).classList.add('active');
      currentStep = step - 1;
      updateProgress();
    }
  }

  // Инициализация прогресса
  updateProgress();

  // Отправка формы
  const form = document.getElementById('surveyForm');
  const success = document.getElementById('successMessage');
  const submitBtn = document.getElementById('submitBtn');

  form.addEventListener('submit', function(e) {
    e.preventDefault();
    submitBtn.textContent = 'Отправка...';
    submitBtn.disabled = true;

    const formData = new FormData(form);

    fetch(form.action, {
      method: 'POST',
      body: formData
    })
    .then(() => {
      form.style.display = 'none';
      document.querySelector('.progress-wrap').style.display = 'none';
      success.style.display = 'block';
    })
    .catch(error => {
      console.error('Ошибка:', error);
      alert('Ошибка отправки. Проверьте соединение.');
      submitBtn.textContent = 'Отправить ответы';
      submitBtn.disabled = false;
    });
  });
</script>

</body>
</html>
