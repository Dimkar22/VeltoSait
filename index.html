<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Velto Messenger — Опрос</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Inter', sans-serif;
    background: linear-gradient(135deg, #0F0C1B 0%, #1A1625 100%);
    color: #FFFFFF;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
    overflow-x: hidden;
    position: relative;
  }

  /* Фоновые пятна */
  .blob {
    position: absolute;
    border-radius: 50%;
    filter: blur(100px);
    z-index: 0;
    opacity: 0.6;
    animation: float 8s infinite ease-in-out alternate;
  }
  .blob-1 { width: 400px; height: 400px; background: #8B5CF6; top: -100px; left: -100px; }
  .blob-2 { width: 300px; height: 300px; background: #A855F7; bottom: -50px; right: -50px; animation-delay: 2s; }
  @keyframes float {
    0% { transform: translate(0, 0) scale(1); }
    100% { transform: translate(30px, 20px) scale(1.1); }
  }

  .container {
    background: rgba(255, 255, 255, 0.05);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 24px;
    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
    width: 100%;
    max-width: 600px;
    padding: 40px;
    position: relative;
    z-index: 1;
    overflow: hidden;
  }

  /* Экран приветствия */
  .welcome-screen {
    text-align: center;
    padding: 20px 0;
    animation: slideIn 0.5s ease;
  }
  .welcome-screen h1 {
    font-size: 38px;
    margin-bottom: 15px;
    background: linear-gradient(90deg, #FFFFFF, #A855F7);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .welcome-screen p {
    color: #A1A1AA;
    font-size: 16px;
    margin-bottom: 30px;
    line-height: 1.5;
  }

  /* Прогресс-бар */
  .progress-wrap {
    width: 100%;
    height: 4px;
    background: rgba(255, 255, 255, 0.1);
    border-radius: 2px;
    margin-bottom: 30px;
    overflow: hidden;
    display: none; /* Скрыт на приветствии */
  }
  .progress-bar {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, #8B5CF6, #A855F7);
    border-radius: 2px;
    transition: width 0.4s ease;
    box-shadow: 0 0 10px rgba(139, 92, 246, 0.6);
  }

  h2.title-survey {
    font-size: 26px;
    font-weight: 800;
    margin-bottom: 25px;
    text-align: center;
    display: none; /* Скрыт на приветствии */
  }

  .step {
    display: none;
    animation: slideIn 0.4s ease forwards;
  }
  .step.active {
    display: block;
  }
  @keyframes slideIn {
    from { opacity: 0; transform: translateX(30px); }
    to { opacity: 1; transform: translateX(0); }
  }

  .question-label {
    display: block;
    font-weight: 600;
    color: #FFFFFF;
    margin-bottom: 20px;
    font-size: 18px;
    line-height: 1.4;
  }

  input[type="text"],
  input[type="email"],
  textarea {
    width: 100%;
    padding: 16px;
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 12px;
    font-size: 16px;
    font-family: inherit;
    color: #FFFFFF;
    transition: all 0.3s ease;
    margin-bottom: 20px;
  }
  input:focus, textarea:focus {
    outline: none;
    border-color: #8B5CF6;
    background: rgba(255, 255, 255, 0.08);
    box-shadow: 0 0 15px rgba(139, 92, 246, 0.3);
  }
  textarea { resize: vertical; min-height: 100px; }

  .options label {
    display: flex;
    align-items: center;
    padding: 16px;
    margin-bottom: 12px;
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 12px;
    cursor: pointer;
    transition: all 0.3s ease;
    font-size: 16px;
    color: #FFFFFF;
  }
  .options label:hover {
    background: rgba(255, 255, 255, 0.08);
    border-color: rgba(255, 255, 255, 0.2);
  }
  .options input[type="radio"],
  .options input[type="checkbox"] {
    margin-right: 14px;
    accent-color: #8B5CF6;
    width: 18px;
    height: 18px;
    cursor: pointer;
  }
  .options label:has(input:checked) {
    border-color: #8B5CF6;
    background: rgba(139, 92, 246, 0.1);
    box-shadow: 0 0 15px rgba(139, 92, 246, 0.2);
  }
  .options input:checked + span { color: #A855F7; font-weight: 600; }

  /* Поле "Другое" */
  .other-input {
    display: none;
    margin-top: -5px;
    margin-bottom: 15px;
    animation: slideIn 0.3s ease;
  }
  .other-input.active { display: block; }

  .btn {
    width: 100%;
    padding: 16px;
    background: #8B5CF6;
    color: #FFFFFF;
    border: none;
    border-radius: 12px;
    font-size: 17px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.3s ease;
    margin-top: 10px;
    box-shadow: 0 4px 15px rgba(139, 92, 246, 0.3);
  }
  .btn:hover {
    background: #A855F7;
    transform: translateY(-2px);
    box-shadow: 0 6px 20px rgba(168, 85, 247, 0.4);
  }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
  
  .btn-start {
    font-size: 18px;
    padding: 18px;
    background: linear-gradient(90deg, #8B5CF6, #A855F7);
  }
  
  .btn-row { display: flex; gap: 12px; }
  .btn-back {
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid rgba(255, 255, 255, 0.1);
    box-shadow: none;
  }
  .btn-back:hover { background: rgba(255, 255, 255, 0.1); transform: translateY(-2px); }

  .success {
    display: none;
    text-align: center;
    padding: 40px 0;
  }
  .success .icon {
    font-size: 60px;
    margin-bottom: 20px;
    display: inline-block;
    animation: pop 0.5s ease-out;
  }
  @keyframes pop {
    0% { transform: scale(0); }
    80% { transform: scale(1.2); }
    100% { transform: scale(1); }
  }
  .success h2 { font-size: 28px; font-weight: 800; margin-bottom: 10px; }
  .success p { color: #A1A1AA; font-size: 16px; }
  .required { color: #EF4444; }

  @media (max-width: 480px) {
    .container { padding: 25px; }
    .welcome-screen h1 { font-size: 28px; }
    .question-label { font-size: 16px; }
  }
</style>
</head>
<body>

<div class="blob blob-1"></div>
<div class="blob blob-2"></div>

<div class="container">
  
  <!-- ЭКРАН ПРИВЕТСТВИЯ -->
  <div id="welcomeScreen" class="welcome-screen">
    <h1>Velto Messenger</h1>
    <p>Мы создаем мессенджер нового поколения. Помогите нам сделать его идеальным — ответьте на несколько коротких вопросов.</p>
    <button type="button" class="btn btn-start" onclick="startSurvey()">Начать опрос 🚀</button>
  </div>

  <!-- ПРОГРЕСС-БАР -->
  <div class="progress-wrap" id="progressWrap">
    <div class="progress-bar" id="progressBar"></div>
  </div>

  <h2 class="title-survey" id="surveyTitle">Velto Messenger</h2>

  <!-- ФОРМА ОПРОСА -->
  <form id="surveyForm" action="https://formsubmit.co/Velto22@yandex.com" method="POST" target="hidden_iframe" style="display: none;">
    <input type="hidden" name="_captcha" value="false">
    <input type="hidden" name="_subject" value="Новый ответ от Velto Messenger!">
    <input type="hidden" name="_template" value="table">

    <!-- ===== ВОПРОС 1: Имя ===== -->
    <div class="step active" data-step="1">
      <label class="question-label" for="name">Ваше имя <span class="required">*</span></label>
      <input type="text" id="name" name="Имя" placeholder="Введите имя" required>
      <button type="button" class="btn" onclick="nextStep(1)">Далее</button>
    </div>

    <!-- ===== ВОПРОС 2: Email ===== -->
    <div class="step" data-step="2">
      <label class="question-label" for="email">Ваш Email <span class="required">*</span></label>
      <input type="email" id="email" name="Email" placeholder="example@mail.com" required>
      <div class="btn-row">
        <button type="button" class="btn btn-back" onclick="prevStep(2)">Назад</button>
        <button type="button" class="btn" onclick="nextStep(2)">Далее</button>
      </div>
    </div>

    <!-- ===== ВОПРОС 3: Платформа ===== -->
    <div class="step" data-step="3">
      <label class="question-label">На какой платформе вы бы хотели видеть Velto Messenger? <span class="required">*</span></label>
      <div class="options">
        <label><input type="radio" name="Платформа" value="iOS" required><span>iOS (iPhone)</span></label>
        <label><input type="radio" name="Платформа" value="Android"><span>Android</span></label>
        <label><input type="radio" name="Платформа" value="Windows / macOS"><span>Windows / macOS</span></label>
        <label><input type="radio" name="Платформа" value="Веб-версия"><span>Веб-версия</span></label>
      </div>
      <div class="btn-row">
        <button type="button" class="btn btn-back" onclick="prevStep(3)">Назад</button>
        <button type="button" class="btn" onclick="nextStep(3)">Далее</button>
      </div>
    </div>

    <!-- ===== ВОПРОС 4: Функции (Текст) ===== -->
    <div class="step" data-step="4">
      <label class="question-label" for="features">Какие функции вы хотите видеть в Velto Messenger?</label>
      <textarea id="features" name="Желаемые функции" placeholder="Опишите, что для вас важно..."></textarea>
      <div class="btn-row">
        <button type="button" class="btn btn-back" onclick="prevStep(4)">Назад</button>
        <button type="button" class="btn" onclick="nextStep(4)">Далее</button>
      </div>
    </div>

    <!-- ===== ВОПРОС 5: Что важно (Чекбоксы + Другое) ===== -->
    <div class="step" data-step="5">
      <label class="question-label">Что для вас наиболее важно в мессенджере? (Можно несколько) <span class="required">*</span></label>
      <div class="options">
        <label><input type="checkbox" name="Важное_Безопасность" value="Да"><span>Безопасность и шифрование</span></label>
        <label><input type="checkbox" name="Важное_Скорость" value="Да"><span>Скорость работы</span></label>
        <label><input type="checkbox" name="Важное_Интерфейс" value="Да"><span>Удобный интерфейс</span></label>
        <label><input type="checkbox" name="Важное_Бесплатность" value="Да"><span>Бесплатность</span></label>
        <label>
          <input type="checkbox" id="otherCheckbox" onchange="toggleOtherInput()">
          <span>Другое (свой вариант)</span>
        </label>
      </div>
      <div class="other-input" id="otherInputDiv">
        <input type="text" name="Важное_Другое" placeholder="Напишите свой вариант...">
      </div>
      <div class="btn-row">
        <button type="button" class="btn btn-back" onclick="prevStep(5)">Назад</button>
        <button type="button" class="btn" onclick="nextStep(5)">Далее</button>
      </div>
    </div>

    <!-- ===== ВОПРОС 6: Готовность тестировать ===== -->
    <div class="step" data-step="6">
      <label class="question-label">Готовы ли вы тестировать Velto Messenger до официального релиза? <span class="required">*</span></label>
      <div class="options">
        <label><input type="radio" name="Готовность_тестировать" value="Да, с удовольствием" required><span>Да, с удовольствием</span></label>
        <label><input type="radio" name="Готовность_тестировать" value="Возможно"><span>Возможно</span></label>
        <label><input type="radio" name="Готовность_тестировать" value="Нет"><span>Нет</span></label>
      </div>
      <div class="btn-row">
        <button type="button" class="btn btn-back" onclick="prevStep(6)">Назад</button>
        <button type="button" class="btn" onclick="nextStep(6)">Далее</button>
      </div>
    </div>

    <!-- ===== ВОПРОС 7: Пожелания ===== -->
    <div class="step" data-step="7">
      <label class="question-label" for="wishes">Ваши дополнительные пожелания</label>
      <textarea id="wishes" name="Пожелания" placeholder="Всё, что хотите добавить..."></textarea>
      <div class="btn-row">
        <button type="button" class="btn btn-back" onclick="prevStep(7)">Назад</button>
        <button type="submit" class="btn" id="submitBtn">Отправить ответы</button>
      </div>
    </div>

  </form>

  <!-- ЭКРАН УСПЕХА -->
  <div class="success" id="successMessage">
    <div class="icon">✅</div>
    <h2>Спасибо!</h2>
    <p>Ваши ответы отправлены. Мы ценим ваш вклад в развитие Velto Messenger.</p>
  </div>
</div>

<iframe name="hidden_iframe" id="hidden_iframe" style="display:none;"></iframe>

<script>
  const totalSteps = 7;
  let currentStep = 1;
  const progressBar = document.getElementById('progressBar');

  // Запуск опроса
  function startSurvey() {
    document.getElementById('welcomeScreen').style.display = 'none';
    document.getElementById('progressWrap').style.display = 'block';
    document.getElementById('surveyTitle').style.display = 'block';
    document.getElementById('surveyForm').style.display = 'block';
    updateProgress();
  }

  function updateProgress() {
    const percent = ((currentStep - 1) / (totalSteps - 1)) * 100;
    progressBar.style.width = percent + '%';
  }

  // Показ/скрытие поля "Другое"
  function toggleOtherInput() {
    const checkbox = document.getElementById('otherCheckbox');
    const inputDiv = document.getElementById('otherInputDiv');
    if (checkbox.checked) {
      inputDiv.classList.add('active');
    } else {
      inputDiv.classList.remove('active');
    }
  }

  // Проверка валидации и переход вперед
  function nextStep(step) {
    const currentDiv = document.querySelector(`.step[data-step="${step}"]`);
    
    // Проверка текстовых полей
    let valid = true;
    const requiredTexts = currentDiv.querySelectorAll('input[type="text"][required], input[type="email"][required]');
    requiredTexts.forEach(field => {
      if (!field.value.trim()) {
        field.reportValidity();
        valid = false;
      }
    });

    // Проверка радио-кнопок
    const radioGroups = {};
    currentDiv.querySelectorAll('input[type="radio"][required]').forEach(radio => {
      radioGroups[radio.name] = true;
    });
    for (const name in radioGroups) {
      if (!currentDiv.querySelector(`input[name="${name}"]:checked`)) {
        valid = false;
        alert('Пожалуйста, выберите вариант ответа.');
        return;
      }
    }

    // Специальная проверка для чекбоксов (Вопрос 5)
    if (step === 5) {
      const checkedBoxes = currentDiv.querySelectorAll('input[type="checkbox"]:checked');
      if (checkedBoxes.length === 0) {
        valid = false;
        alert('Пожалуйста, выберите хотя бы один вариант.');
        return;
      }
      // Если выбран "Другое", проверяем, что текст введен
      const otherCb = document.getElementById('otherCheckbox');
      if (otherCb && otherCb.checked) {
        const otherText = document.getElementById('otherInputDiv').querySelector('input').value.trim();
        if (!otherText) {
          alert('Пожалуйста, напишите свой вариант в поле "Другое".');
          valid = false;
          return;
        }
      }
    }

    if (!valid) return;

    if (step < totalSteps) {
      currentDiv.classList.remove('active');
      const nextDiv = document.querySelector(`.step[data-step="${step + 1}"]`);
      nextDiv.classList.add('active');
      currentStep = step + 1;
      updateProgress();
    }
  }

  function prevStep(step) {
    if (step > 1) {
      document.querySelector(`.step[data-step="${step}"]`).classList.remove('active');
      document.querySelector(`.step[data-step="${step - 1}"]`).classList.add('active');
      currentStep = step - 1;
      updateProgress();
    }
  }

  // Отправка формы
  const form = document.getElementById('surveyForm');
  const success = document.getElementById('successMessage');
  const submitBtn = document.getElementById('submitBtn');
  const hiddenIframe = document.getElementById('hidden_iframe');

  form.addEventListener('submit', function(e) {
    e.preventDefault();
    submitBtn.textContent = 'Отправка...';
    submitBtn.disabled = true;

    const formData = new FormData(form);

    fetch(form.action, {
      method: 'POST',
      body: formData,
      headers: { 'Accept': 'application/json' }
    })
    .then(response => {
      if (response.ok) return response.json();
      throw new Error('Network response was not ok');
    })
    .then(data => {
      showSuccess(); // Если FormSubmit принял, показываем успех
    })
    .catch(error => {
      console.warn('Fetch failed, using iframe fallback:', error);
      form.target = 'hidden_iframe';
      form.submit();
      setTimeout(showSuccess, 1500);
    });
  });

  function showSuccess() {
    form.style.display = 'none';
    document.getElementById('progressWrap').style.display = 'none';
    document.getElementById('surveyTitle').style.display = 'none';
    success.style.display = 'block';
  }
  
  // Запасной обработчик для iframe
  hiddenIframe.addEventListener('load', function() {
    if (submitBtn.disabled && form.style.display !== 'none') {
       // Если форма уже отправилась, страховка
       setTimeout(showSuccess, 500);
    }
  });
</script>

</body>
</html>
